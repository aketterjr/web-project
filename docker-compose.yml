services:
  backend:
    build: 
      context: ./backend  # Assuming your Django project is in a 'backend' directory
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build: 
      context: ./frontend  # Assuming your React app is in a 'frontend' directory
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - BROWSER=none
    command: npm start --watch