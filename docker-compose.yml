services:
  backend:
    build: 
      context: ./backend  # Assuming your Django project is in a 'backend' directory
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build: 
      context: ./frontend  # Assuming your React app is in a 'frontend' directory
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules:/app/node_modules
    command: npm start